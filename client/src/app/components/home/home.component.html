<div [class.blurred]="!isLoggedIn">
  @if (isLoggedIn) {
    <app-header></app-header>
    <div class="content-container">
      <app-todo-list class="todo-list-container"></app-todo-list>
      <app-todo-calendar class="calendar-container"></app-todo-calendar>
    </div>
  }
</div>

@if (!isLoggedIn) {
  <app-auth-options class="auth-dialog"></app-auth-options>
}
